<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Smart Upkeep — SmartKeep V.2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500&family=Khand:wght@600&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #FAF3EB; color: #2b2b2b; font-family: 'Hind', sans-serif;
         display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 24px 16px; }
  h1 { font-family: 'Khand', sans-serif; font-weight: 600; font-size: clamp(1.8rem, 5vw, 2.8rem); margin: 8px 0 20px; text-align: center; }
  video { width: 100%; border-radius: 12px; background: #000; display: block; }
  .v-wide { max-width: 960px; }
  .v-tall { max-width: 420px; display: none; }
  @media (max-width: 700px), (orientation: portrait) and (max-width: 900px) {
    .v-wide { display: none; } .v-tall { display: block; }
  }
  .wrap { width: 100%; display: flex; justify-content: center; }
  .actions { margin: 20px 0; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: center; }
  a { color: #b5562b; }
  button { font-family: 'Hind', sans-serif; font-size: 1rem; font-weight: 500; padding: 10px 22px; border: 0;
           border-radius: 999px; background: #b5562b; color: #fff; cursor: pointer; }
  #msg { min-height: 1.2em; font-size: .9rem; }
  footer { margin-top: auto; padding-top: 24px; font-size: .85rem; }
</style>
</head>
<body>
  <h1>Smart Upkeep — SmartKeep V.2</h1>
  <div class="wrap">
    <video class="v-wide" controls playsinline preload="metadata"><source src="SmartKeep_V2.mp4?v=20261013" type="video/mp4"></video>
    <video class="v-tall" controls playsinline preload="metadata"><source src="SmartKeep_V2_9x16.mp4?v=20261013" type="video/mp4"></video>
  </div>
  <div class="actions">
    <a href="SmartKeep_V2.mp4?v=20261013">Direct link: 16:9 video</a>
    <a href="SmartKeep_V2_9x16.mp4?v=20261013">Direct link: 9:16 video</a>
    <button id="share" type="button">Share</button>
  </div>
  <div id="msg"></div>
  <footer>Built by <a href="https://maxweberman.com">Max Weberman</a></footer>
<script>
  document.querySelectorAll('video').forEach(v => v.addEventListener('play', () =>
    document.querySelectorAll('video').forEach(o => { if (o !== v) o.pause(); })));
  document.getElementById('share').addEventListener('click', async () => {
    const url = location.href, msg = document.getElementById('msg');
    if (navigator.share) { try { await navigator.share({ title: document.title, url }); return; } catch (e) { if (e.name === 'AbortError') return; } }
    try { await navigator.clipboard.writeText(url); msg.textContent = 'Link copied!'; }
    catch (e) { window.prompt('Copy this link:', url); }
  });
</script>
</body>
</html>
